<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinishBoard</title>
  <meta name="description" content="FinishBoard public support and legal page handoff.">
  <link rel="canonical" href="https://www.estreamedia.my/finishboard/">
  <style>
    :root { color-scheme: light; --ink:#17202a; --muted:#5d6975; --line:#d8dee4; --accent:#4f46e5; --bg:#f7f8fc; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); line-height: 1.6; }
    main { max-width: 820px; margin: 0 auto; padding: 48px 24px; }
    article { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
    nav { display: flex; flex-wrap: wrap; gap: 14px; margin: 24px 0; }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 8px; }
    p, li { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>FinishBoard</h1>
      <p>A local-first workspace for finish samples, revision decisions, production references, managed media, and verified backups.</p>
      <nav aria-label="FinishBoard pages"><a href="support/">Support</a><a href="privacy/">Privacy Policy</a><a href="terms/">Terms of Use</a></nav>
      <p>These pages are a local publisher handoff draft. They are not deployed or represented as the current live website.</p>
    </article>
  </main>
</body>
</html>
